# Reproducible Phase 13 infrastructure smoke topology.
# This intentionally excludes the application containers so infrastructure
# health can be validated independently from application behavior.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: goanalyze
      POSTGRES_PASSWORD: phase13-ci-password
      POSTGRES_DB: goanalyze
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goanalyze -d goanalyze"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [platform]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: phase13-OpenSearch-password-1!
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks: [platform]

  minio:
    # MinIO's upstream community images are no longer anonymously pullable.
    # This maintained Chainguard image is for local/CI only; production should
    # use a customer-managed S3-compatible service and pin approved image digests.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: phase13minio
      MINIO_ROOT_PASSWORD: phase13-minio-password-1!
    networks: [platform]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: phase13admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: phase13-keycloak-password-1!
      KC_HEALTH_ENABLED: "true"
    # The official Keycloak image intentionally omits curl. Readiness is
    # validated externally by smoke-client against the management endpoint.
    networks: [platform]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks: [platform]

  smoke-client:
    image: curlimages/curl:8.15.0
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 3600"]
    networks: [platform]
    profiles: [smoke]

networks:
  platform:
    driver: bridge
