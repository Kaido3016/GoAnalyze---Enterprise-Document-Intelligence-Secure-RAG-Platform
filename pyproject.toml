[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gov_platform"]

[project]
name = "goanalyze-government-platform"
version = "2.0.0"
description = "Government-grade AI document intelligence platform release candidate"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "redis>=5.0.7",
  "opensearch-py>=2.6.0",
  "minio>=7.2.7",
  "confluent-kafka>=2.5.0",
  "temporalio>=1.7.0",
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
  "pyjwt[crypto]>=2.13.0",
  "pypdf>=5.9.0",
  "pypdfium2>=4.30.0",
  "pytesseract>=0.3.13",
  "Pillow>=11.3.0",
  "python-docx>=1.2.0",
  "numpy>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "aiosqlite>=0.20.0",
  "cryptography>=42.0.0",
  "fakeredis>=2.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends(...) as a default argument is the framework's
# documented dependency-injection idiom, not a real bug.
ignore = ["B008"]

