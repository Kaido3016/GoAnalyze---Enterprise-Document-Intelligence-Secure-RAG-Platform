# Local integration/demo topology only. Production deployments must use the
# Kubernetes/Helm path with customer-managed secrets, TLS and service security.
# No credentials are hard-coded; required secrets are supplied by the caller.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GOV_ENVIRONMENT: ${GOV_ENVIRONMENT:?set GOV_ENVIRONMENT (development|staging|production)}
      GOV_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      GOV_REDIS_URL: redis://redis:6379/0
      GOV_OPENSEARCH_URL: http://opensearch:9200
      GOV_MINIO_ENDPOINT: minio:9000
      GOV_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      GOV_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      GOV_MINIO_BUCKET: ${GOV_MINIO_BUCKET:-goanalyze-documents}
      GOV_MINIO_SECURE: "false"
      GOV_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GOV_TEMPORAL_TARGET_HOST: temporal:7233
      GOV_KEYCLOAK_ISSUER: ${GOV_KEYCLOAK_ISSUER:-http://keycloak:8080/realms/goanalyze}
      GOV_KEYCLOAK_AUDIENCE: ${GOV_KEYCLOAK_AUDIENCE:-goanalyze-api}
      GOV_EMBEDDING_BASE_URL: ${GOV_EMBEDDING_BASE_URL:-}
      GOV_EMBEDDING_API_KEY: ${GOV_EMBEDDING_API_KEY:-}
      GOV_EMBEDDING_MODEL: ${GOV_EMBEDDING_MODEL:-text-embedding-3-small}
      GOV_LLM_BASE_URL: ${GOV_LLM_BASE_URL:-}
      GOV_LLM_API_KEY: ${GOV_LLM_API_KEY:-}
      GOV_LLM_MODEL: ${GOV_LLM_MODEL:-gpt-4.1-mini}
      GOV_ALLOW_INSECURE_DEV_AUTH: ${GOV_ALLOW_INSECURE_DEV_AUTH:-false}
      GOV_AUDIT_HASH_SECRET: ${GOV_AUDIT_HASH_SECRET:?set GOV_AUDIT_HASH_SECRET to a strong, unique value - never commit a real value}
      GOV_ALLOWED_ORIGINS: ${GOV_ALLOWED_ORIGINS:-["http://localhost:3000"]}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
      temporal:
        condition: service_started
      keycloak:
        condition: service_started
    networks: [app]

  document-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "gov_platform.worker"]
    restart: unless-stopped
    environment:
      GOV_ENVIRONMENT: ${GOV_ENVIRONMENT:?set GOV_ENVIRONMENT (development|staging|production)}
      GOV_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      GOV_MINIO_ENDPOINT: minio:9000
      GOV_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      GOV_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      GOV_MINIO_BUCKET: ${GOV_MINIO_BUCKET:-goanalyze-documents}
      GOV_MINIO_SECURE: "false"
      GOV_AUDIT_HASH_SECRET: ${GOV_AUDIT_HASH_SECRET:?set GOV_AUDIT_HASH_SECRET}
      GOV_EMBEDDING_BASE_URL: ${GOV_EMBEDDING_BASE_URL:-}
      GOV_EMBEDDING_API_KEY: ${GOV_EMBEDDING_API_KEY:-}
      GOV_EMBEDDING_MODEL: ${GOV_EMBEDDING_MODEL:-text-embedding-3-small}
      GOV_LLM_BASE_URL: ${GOV_LLM_BASE_URL:-}
      GOV_LLM_API_KEY: ${GOV_LLM_API_KEY:-}
      GOV_LLM_MODEL: ${GOV_LLM_MODEL:-gpt-4.1-mini}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [app]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_GOV_API_URL: ${NEXT_PUBLIC_GOV_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
    networks: [app]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redisdata:/data
    networks: [app]

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?set OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    networks: [app]

  # Initialize the named volume for the non-root Chainguard MinIO user.
  minio-init:
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - miniodata:/data
    restart: "no"
    networks: [app]

  minio:
    # Local/demo only. Production should use an approved managed S3 service.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks: [app]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [app]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [app]

  temporal:
    image: temporalio/auto-setup:1.24.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8081:8080"
    networks: [app]

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [app]

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3001:3000"
    networks: [app]

  loki:
    image: grafana/loki:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    networks: [app]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks: [app]

networks:
  app:
    driver: bridge
    internal: false

volumes:
  pgdata:
  redisdata:
  opensearchdata:
  miniodata:
